name: Keepalive
# O GitHub desativa schedules de repositórios sem commits há 60 dias.
# Este workflow faz um commit vazio mensal para manter o monitor vivo.
on:
  schedule:
    - cron: '23 12 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "keepalive-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit --allow-empty -m "keepalive: manter schedule ativo"
          git push
