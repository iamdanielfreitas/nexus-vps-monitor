name: VPS Monitor
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Enviar alerta de teste no Slack'
        required: false
        default: 'false'

permissions:
  actions: read

concurrency:
  group: vps-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checar VPS (TCP 443/80)
        id: check
        run: |
          HOST="129.121.47.82"
          ok=0
          for i in 1 2 3; do
            if timeout 10 bash -c "</dev/tcp/$HOST/443" 2>/dev/null || timeout 10 bash -c "</dev/tcp/$HOST/80" 2>/dev/null; then
              ok=1
              break
            fi
            [ "$i" -lt 3 ] && sleep 20
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Status do run anterior
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh api "repos/${{ github.repository }}/actions/workflows/monitor.yml/runs?per_page=1&status=completed" \
            --jq '.workflow_runs[0].conclusion' 2>/dev/null || echo "unknown")
          echo "conclusion=${prev:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Alerta de teste
        if: github.event.inputs.test_alert == 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          MSG="🧪 Teste do monitor nexus-vps via GitHub Actions — alertas funcionando (checagem atual: ok=${{ steps.check.outputs.ok }})."
          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"channel\":\"$SLACK_CHANNEL_ID\",\"text\":\"$MSG\"}"

      - name: Alerta — VPS caiu
        if: steps.check.outputs.ok == '0' && steps.prev.outputs.conclusion != 'failure'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          NOW=$(TZ=America/Sao_Paulo date '+%d/%m %H:%M')
          MSG="🔴 *nexus-vps INACESSÍVEL* ($NOW BRT) — checagem externa falhou: TCP 443/80 sem resposta em 3 tentativas (~1 min). Verificar painel do provedor."
          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"channel\":\"$SLACK_CHANNEL_ID\",\"text\":\"$MSG\"}"

      - name: Alerta — VPS voltou
        if: steps.check.outputs.ok == '1' && steps.prev.outputs.conclusion == 'failure'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          NOW=$(TZ=America/Sao_Paulo date '+%d/%m %H:%M')
          MSG="🟢 *nexus-vps voltou* ($NOW BRT) — respondendo normalmente."
          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"channel\":\"$SLACK_CHANNEL_ID\",\"text\":\"$MSG\"}"

      - name: Marcar run como down
        if: steps.check.outputs.ok == '0'
        run: exit 1
